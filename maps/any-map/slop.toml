# The least any map needs: two clients play it on the host, and the host checks every tick that
# they agree. With no map.file, the one map file in this folder is played: (2)Hammerfall_S3, a
# W3Champions ladder map (Season 9), shipped here as a small, ordinary melee map to try things
# on. To test another map, make a folder like this one under maps/ with that map in it.
#
#   ./slop up               # this is the default map (configuration.toml: map)
#   ./slop test any-map
#
# Lua maps also get the library (the trace, .units/.order/...); JASS maps run without it.

[map]
folder = "slop"

[host]
# hidden: the host takes no slot, so the map plays exactly as it would on Battle.net.
# active: the host plays a seat of its own and can act; see ../warcraft-maul.
mode = "hidden"

[clients]
count = 2
names = ["red", "blue"]

[tests]
file = "tests.py"
