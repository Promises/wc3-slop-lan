# Keeps every Warcraft III on this machine (the Windows build, on Windows or under Wine) on its
# real LAN provider. See src/main.rs and ../docs/porting.md.
[package]
name = "slop-activator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
